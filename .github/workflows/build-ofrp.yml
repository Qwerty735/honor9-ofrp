name: Build OrangeFox 12.1

on:
  workflow_dispatch:
  push:
    branches: [main, master, fox_12.1]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync ccache libssl-dev bc cpio wget
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          git config --global user.email "ofrp-ci@localhost"
          git config --global user.name "OFRP CI"
          git config --global color.ui false

      - name: Sync OrangeFox fox_12.1
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
          cd OrangeFox_sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/fox_12.1"

      # The runner only has ~45 GB free, and a full sync plus out/ is right at
      # the edge of that. The git objects in .repo are no longer needed once the
      # tree is checked out, so drop them before building.
      - name: Reclaim disk space
        run: |
          df -h /
          du -sh fox_12.1/.repo 2>/dev/null || true
          rm -rf fox_12.1/.repo
          df -h /

      - name: Install device tree
        run: |
          mkdir -p fox_12.1/device/huawei/stanford
          rsync -a --exclude '.git' --exclude 'Android-Image-Kitchen-master' \
            --exclude '_ramdisk_extract' --exclude '.github' \
            device-tree/ fox_12.1/device/huawei/stanford/

      - name: Build recoveryimage
        run: |
          cd fox_12.1
          df -h /
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE=stanford
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_VANILLA_BUILD=1
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          # envsetup.sh ends with addcompletions(), which returns non-zero in a
          # non-interactive shell. Every function is already defined at that
          # point, but `bash -e` would abort the step on the non-zero status.
          set +e
          source build/envsetup.sh
          set -e
          lunch twrp_stanford-eng
          mka adbd recoveryimage -j$(nproc)

      - name: Verify recovery image header
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, struct, sys

          images = sorted(set(glob.glob('fox_12.1/out/target/product/stanford/OrangeFox*.img')
                              + glob.glob('fox_12.1/out/target/product/stanford/recovery.img')))
          if not images:
              print("no recovery images found")
              sys.exit(0)

          # The HiSilicon bootloader and the stock kernel only accept the load
          # addresses used by the stock EMUI recovery_ramdisk. Anything else
          # panics before init runs (visible as a reboot loop on the logo).
          EXPECTED = {
              'kernel_addr': 0x10008000,
              'ramdisk_addr': 0x11000000,
              'tags_addr': 0x10000100,
          }
          # mkbootimg writes second_addr=0 when no second stage is passed, and
          # the stock EMUI header only carries 0x10f00000 because Huawei's
          # mkbootimg variant is unconditional. Both are fine: second_size is 0,
          # so the bootloader never loads anything there.
          ALLOWED_SECOND_ADDR = (0x0, 0x10f00000)
          REQUIRED_CMDLINE = ('androidboot.selinux=permissive',
                              'androidboot.super_partition=system')

          ok = True
          for path in images:
              with open(path, 'rb') as f:
                  data = f.read(1632)
              if data[:8] != b'ANDROID!':
                  print(f"{path}: BAD MAGIC {data[:8]!r}")
                  sys.exit(1)
              fields = struct.unpack('<8I', data[8:40])
              kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, \
                  second_size, second_addr, tags_addr, page_size = fields
              header_version, os_version = struct.unpack('<2I', data[40:48])
              cmdline = data[64:1088].split(b'\0', 1)[0].decode('ascii', 'replace')
              print(f"{path}:")
              print(f"  kernel_size={kernel_size} ramdisk_size={ramdisk_size} "
                    f"page_size={page_size} header_version={header_version}")
              print(f"  kernel_addr={kernel_addr:#x} ramdisk_addr={ramdisk_addr:#x} "
                    f"second_addr={second_addr:#x} tags_addr={tags_addr:#x}")
              print(f"  os_version={os_version:#x}")
              print(f"  cmdline={cmdline!r}")
              if kernel_size != 0:
                  print("ERROR: kernel must not be embedded in recovery_ramdisk")
                  ok = False
              for name, want in EXPECTED.items():
                  got = {'kernel_addr': kernel_addr, 'ramdisk_addr': ramdisk_addr,
                         'tags_addr': tags_addr}[name]
                  if got != want:
                      print(f"ERROR: {name} is {got:#x}, expected {want:#x}")
                      ok = False
              if second_addr not in ALLOWED_SECOND_ADDR:
                  print(f"ERROR: second_addr is {second_addr:#x}, expected one of "
                        f"{[hex(a) for a in ALLOWED_SECOND_ADDR]}")
                  ok = False
              for want in REQUIRED_CMDLINE:
                  if want not in cmdline:
                      print(f"ERROR: cmdline is missing {want}")
                      ok = False
          if not ok:
              sys.exit(1)
          EOF

      - name: Verify recovery ramdisk contents
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, gzip, os, sys

          ramdisks = glob.glob('fox_12.1/out/target/product/stanford/ramdisk-recovery.img')
          if not ramdisks:
              print("no ramdisk-recovery.img found")
              sys.exit(0)

          required = [
              b'system/bin/init',
              b'system/bin/recovery',
              b'system/bin/twrp',
              b'system/bin/bfm-ctl',
              b'system/bin/fixlinks.sh',
              b'system/bin/logdump.sh',
              b'system/etc/recovery.fstab',
              b'system/etc/twrp.flags',
              b'init.rc',
              b'init.recovery.hi3660.rc',
          ]
          ok = True
          for path in ramdisks:
              raw = open(path, 'rb').read()
              try:
                  blob = gzip.decompress(raw)
              except OSError:
                  blob = raw
              print(f"{path}: {len(raw)} bytes compressed, {len(blob)} uncompressed")
              for name in required:
                  found = name in blob
                  print(f"  {'OK  ' if found else 'MISS'} {name.decode()}")
                  ok = ok and found
          if not ok:
              sys.exit(1)
          EOF

      - name: Collect artifacts
        if: always()
        run: |
          df -h / || true
          du -sh fox_12.1/out 2>/dev/null || true
          mkdir -p artifacts
          OUT="fox_12.1/out/target/product/stanford"
          ls -lah "$OUT" || true
          cp -v "$OUT"/OrangeFox*.img artifacts/ 2>/dev/null || true
          cp -v "$OUT"/OrangeFox*.zip artifacts/ 2>/dev/null || true
          cp -v "$OUT"/recovery.img artifacts/ 2>/dev/null || true
          find "$OUT" -maxdepth 1 -type f \( -name '*.img' -o -name '*.zip' \) -print -exec cp -v {} artifacts/ \; || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ofrp-stanford
          path: artifacts/*
          if-no-files-found: warn

      - name: Generate Release Tag
        id: tag
        run: |
          echo "release_tag=OFRP-v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "OrangeFox Recovery 12.1 Unofficial — Honor 9"
          body: |
            ### Тестовая сборка OrangeFox Recovery 12.1 (Run #${{ github.run_number }})
            - **Устройство:** Honor 9 (stanford / STF)
            - **Исправления:** Проверена структура адресов ядра (`0x11000000`) и `BOARD_SECOND_OFFSET`.
            - **Статус:** Автоматический билд.
          draft: false
          prerelease: true
          files: |
            out/target/product/stanford/*.img
            out/target/product/stanford/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
